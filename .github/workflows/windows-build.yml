name: UTD-Apk · Windows desktop application
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Compile
        run: python -m compileall -q offline_archiver launcher.py
      - name: Test
        run: pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Package compact Windows installer
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name OfflineArchiver --collect-all playwright --collect-all bs4 --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets --exclude-module PySide6.QtPdf --exclude-module PySide6.QtPdfWidgets --exclude-module PySide6.Qt3DCore --exclude-module PySide6.Qt3DRender --exclude-module PySide6.QtMultimedia --exclude-module PySide6.QtCharts --exclude-module PySide6.QtDataVisualization --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick launcher.py
          if (!(Test-Path "dist/OfflineArchiver/OfflineArchiver.exe")) { throw "PyInstaller output missing" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\OfflineArchiver.iss
          if (!(Test-Path "dist/OfflineArchiver-Setup-x64.exe")) { throw "Installer output missing" }
          $size = (Get-Item "dist/OfflineArchiver-Setup-x64.exe").Length
          "Installer size: $([math]::Round($size / 1MB, 1)) MB" | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineArchiver-Windows-x64
          path: dist/OfflineArchiver-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
