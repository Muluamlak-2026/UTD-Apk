[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-archiver"
version = "3.0.0"
description = "Desktop archiver for user-authorized web content"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.7,<7",
  "playwright>=1.48,<2",
  "beautifulsoup4>=4.12,<5",
]

[tool.setuptools.packages.find]
include = ["offline_archiver*"]
